<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cerita Fiksi AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan SDK Google GenAI versi Web (ES Module) -->
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Pengaturan -->
        <aside class="sidebar">
            <h2>Pengaturan AI</h2>
            
            <div class="form-group">
                <label for="apiKey">Gemini API Key:</label>
                <input type="password" id="apiKey" placeholder="Masukkan API Key Anda...">
                <button id="saveKeyBtn" class="btn-secondary">Simpan Key</button>
            </div>

            <div class="form-group">
                <label for="systemInstruction">Peran AI (System Instruction):</label>
                <textarea id="systemInstruction" rows="4">Kamu adalah seorang penulis novel fiksi profesional. Tulis narasi dalam bahasa Indonesia yang kaya deskripsi, imersif, dan sesuai dengan alur cerita.</textarea>
            </div>

            <div class="form-group">
                <label for="storyMemory">Memori / Latar Cerita (Lore/Memory):</label>
                <textarea id="storyMemory" rows="5" placeholder="Contoh: Tokoh utama bernama Gazali, latar di Hulu Sungai..."></textarea>
            </div>
        </aside>

        <!-- Area Editor Utama -->
        <main class="main-editor">
            <header class="editor-header">
                <input type="text" id="storyTitle" placeholder="Judul Cerita Anda..." value="Cerita Fiksi Baru">
                <span id="statusIndicator" class="status-ready">Siap</span>
            </header>

            <div class="editor-content">
                <textarea id="storyBox" placeholder="Mulai ketik paragraf pertama cerita Anda di sini, lalu klik 'Lanjutkan Cerita'..."></textarea>
            </div>

            <footer class="editor-footer">
                <button id="generateBtn" class="btn-primary">Lanjutkan Cerita (Generate) ➤</button>
                <button id="retryBtn" class="btn-secondary">Ulangi (Retry)</button>
            </footer>
        </main>
    </div>

    <!-- Script Utama -->
    <script type="module" src="script.js"></script>
</body>
</html>
